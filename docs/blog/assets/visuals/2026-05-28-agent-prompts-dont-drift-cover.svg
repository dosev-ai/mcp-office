<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Writing agent prompts that don’t drift</title>
  <desc id="desc">A prompt is a contract: role, task, constraints, non-goals, evidence</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f472b6"/>
    </marker>
    <style>
      .title { font: 700 56px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font: 400 25px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .label { font: 700 24px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .micro { font: 400 14px Arial, Helvetica, sans-serif; fill: #94a3b8; }
      .code { font: 700 17px Consolas, Menlo, monospace; fill: #dbeafe; }
      .card { fill: rgba(15, 23, 42, 0.78); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.5; }
      .box { fill: rgba(15, 23, 42, 0.88); stroke: rgba(148, 163, 184, 0.42); stroke-width: 1.5; }
      .boxAccent { fill: rgba(6, 78, 59, 0.58); stroke: #f472b6; stroke-opacity: 0.55; stroke-width: 1.6; }
      .warn { fill: rgba(127, 29, 29, 0.34); stroke: rgba(248, 113, 113, 0.42); stroke-width: 1.4; }
      .arrow { stroke: url(#accent); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .line { stroke: rgba(148, 163, 184, 0.32); stroke-width: 1.2; }
      .pill { fill: rgba(2, 6, 23, 0.42); stroke: rgba(148, 163, 184, 0.26); stroke-width: 1; }
      .chip { font: 700 15px Arial, Helvetica, sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1365" cy="110" r="270" fill="#ffffff" opacity="0.045"/>
  <circle cx="190" cy="795" r="305" fill="#ffffff" opacity="0.04"/>

  <g transform="translate(90 76)">
    <text class="title" x="0" y="0">Writing agent prompts that don’t drift</text>
    <text class="subtitle" x="0" y="46">A prompt is a contract: role, task, constraints, non-goals, evidence</text>
  </g>

  <g transform="translate(90 170)" filter="url(#shadow)">
    <rect class="card" x="0" y="0" width="1420" height="610" rx="34"/>
  </g>


  <g transform="translate(135 250)">
    <rect class="warn" x="0" y="0" width="280" height="420" rx="30"/>
    <text class="label" x="28" y="47">Prompt drift</text>
    <text class="small" x="28" y="84">Vague instruction,</text>
    <text class="small" x="28" y="112">open-ended scope,</text>
    <text class="small" x="28" y="140">unclear evidence.</text>
    <line x1="30" y1="185" x2="245" y2="185" class="line"/>
    <text class="micro" x="28" y="228">Result:</text>
    <text class="small" x="28" y="262">helpful-looking output</text>
    <text class="small" x="28" y="292">that does not match</text>
    <text class="small" x="28" y="322">the delivery gate.</text>
  </g>

  <g transform="translate(505 225)">
    <rect class="boxAccent" x="0" y="0" width="670" height="470" rx="32"/>
    <text class="label" x="34" y="50">Prompt contract anatomy</text>
    <text class="small" x="34" y="84">A useful agent prompt behaves like a scoped work order.</text>

    <g transform="translate(34 128)">
      <rect class="pill" x="0" y="0" width="280" height="55" rx="18"/><text class="code" x="20" y="35">1. Role</text><text class="micro" x="128" y="35">who the agent is</text>
      <rect class="pill" x="320" y="0" width="280" height="55" rx="18"/><text class="code" x="340" y="35">2. Context</text><text class="micro" x="485" y="35">what is true</text>

      <rect class="pill" x="0" y="82" width="280" height="55" rx="18"/><text class="code" x="20" y="117">3. Task</text><text class="micro" x="128" y="117">what to change</text>
      <rect class="pill" x="320" y="82" width="280" height="55" rx="18"/><text class="code" x="340" y="117">4. Non-goals</text><text class="micro" x="500" y="117">what to avoid</text>

      <rect class="pill" x="0" y="164" width="280" height="55" rx="18"/><text class="code" x="20" y="199">5. Constraints</text><text class="micro" x="185" y="199">hard limits</text>
      <rect class="pill" x="320" y="164" width="280" height="55" rx="18"/><text class="code" x="340" y="199">6. Evidence</text><text class="micro" x="490" y="199">PASS / FAIL</text>
    </g>

    <g transform="translate(34 385)">
      <rect x="0" y="0" width="600" height="48" rx="20" fill="rgba(2,6,23,0.42)" stroke="rgba(244,114,182,0.32)"/>
      <text class="small" x="22" y="31">A prompt that cannot be tested is not ready for a delivery lane.</text>
    </g>
  </g>

  <g transform="translate(1255 310)">
    <rect class="box" x="0" y="0" width="185" height="300" rx="28"/>
    <text class="label" x="28" y="48">Clean</text>
    <text class="label" x="28" y="78">handoff</text>
    <line x1="28" y1="118" x2="155" y2="118" class="line"/>
    <text class="micro" x="28" y="154">single concern</text>
    <text class="micro" x="28" y="184">explicit non-goals</text>
    <text class="micro" x="28" y="214">acceptance criteria</text>
    <text class="micro" x="28" y="244">evidence format</text>
  </g>

  <path class="arrow" d="M 428 455 C 460 455 470 455 493 455"/>
  <path class="arrow" d="M 1186 455 C 1214 455 1225 455 1243 455"/>


  <g transform="translate(100 830)">
    <text class="micro" x="0" y="0">Original repo-hosted blog asset - no stock photography - sample data only</text>
  </g>
  <g transform="translate(1195 830)">
    <rect x="0" y="-28" width="300" height="42" rx="21" fill="rgba(148,163,184,0.14)" stroke="rgba(148,163,184,0.34)"/>
    <text x="24" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">How We Build / 2</text>
  </g>
</svg>
