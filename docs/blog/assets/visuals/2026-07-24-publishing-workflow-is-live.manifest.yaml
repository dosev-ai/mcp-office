semantic_description: >-
  The visual presents a controlled publishing pipeline. Privacy, access and
  data-governance controls feed a private article draft. The draft then passes
  content, privacy, link, accessibility and human-approval checks. Desktop,
  tablet and mobile browser validation confirms the public experience before
  controlled publication. The diagram represents a governed public
  proof-of-work process; it does not imply unattended publishing or enterprise
  platform maturity.

claims:
  - The publishing workflow uses private drafting and explicit human approval.
  - Public delivery includes content, privacy, route, accessibility and browser validation.
  - The final publication step is controlled rather than automatic.
