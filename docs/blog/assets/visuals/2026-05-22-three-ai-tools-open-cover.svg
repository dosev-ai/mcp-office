<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Why I have three AI tools open</title>
  <desc id="desc">A personal operating model: one planning hub, two execution layers</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#22d3ee"/>
    </marker>
    <style>
      .title { font: 700 56px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font: 400 25px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .label { font: 700 24px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .micro { font: 400 14px Arial, Helvetica, sans-serif; fill: #94a3b8; }
      .code { font: 700 17px Consolas, Menlo, monospace; fill: #dbeafe; }
      .card { fill: rgba(15, 23, 42, 0.78); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.5; }
      .box { fill: rgba(15, 23, 42, 0.88); stroke: rgba(148, 163, 184, 0.42); stroke-width: 1.5; }
      .boxAccent { fill: rgba(6, 78, 59, 0.58); stroke: #22d3ee; stroke-opacity: 0.55; stroke-width: 1.6; }
      .warn { fill: rgba(127, 29, 29, 0.34); stroke: rgba(248, 113, 113, 0.42); stroke-width: 1.4; }
      .arrow { stroke: url(#accent); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .line { stroke: rgba(148, 163, 184, 0.32); stroke-width: 1.2; }
      .pill { fill: rgba(2, 6, 23, 0.42); stroke: rgba(148, 163, 184, 0.26); stroke-width: 1; }
      .chip { font: 700 15px Arial, Helvetica, sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1365" cy="110" r="270" fill="#ffffff" opacity="0.045"/>
  <circle cx="190" cy="795" r="305" fill="#ffffff" opacity="0.04"/>

  <g transform="translate(90 76)">
    <text class="title" x="0" y="0">Why I have three AI tools open</text>
    <text class="subtitle" x="0" y="46">A personal operating model: one planning hub, two execution layers</text>
  </g>

  <g transform="translate(90 170)" filter="url(#shadow)">
    <rect class="card" x="0" y="0" width="1420" height="610" rx="34"/>
  </g>


  <g transform="translate(135 250)">
    <rect class="box" x="0" y="0" width="260" height="210" rx="28"/>
    <text class="label" x="28" y="45">Voice + thinking</text>
    <text class="small" x="28" y="82">Capture the messy</text>
    <text class="small" x="28" y="108">problem first.</text>
    <rect class="pill" x="28" y="146" width="205" height="42" rx="18"/>
    <text class="chip" x="48" y="173">mobile → desktop</text>
  </g>

  <g transform="translate(600 245)" filter="url(#shadow)">
    <circle cx="180" cy="180" r="160" fill="rgba(34,211,238,0.14)" stroke="rgba(34,211,238,0.55)" stroke-width="2"/>
    <circle cx="180" cy="180" r="92" fill="rgba(15,23,42,0.92)" stroke="rgba(167,139,250,0.7)" stroke-width="2"/>
    <text class="label" x="92" y="165">ChatGPT</text>
    <text class="small" x="87" y="198">planning hub</text>
    <text class="micro" x="79" y="225">think → route → check</text>
  </g>

  <g transform="translate(1110 225)">
    <rect class="boxAccent" x="0" y="0" width="285" height="155" rx="26"/>
    <text class="label" x="26" y="43">Claude Code</text>
    <text class="small" x="26" y="78">Scoped delivery lane</text>
    <text class="code" x="26" y="116">run task → evidence</text>
  </g>

  <g transform="translate(1110 430)">
    <rect class="box" x="0" y="0" width="285" height="155" rx="26"/>
    <text class="label" x="26" y="43">Copilot</text>
    <text class="small" x="26" y="78">Editor + PR context</text>
    <text class="code" x="26" y="116">inline → diff review</text>
  </g>

  <g transform="translate(440 610)">
    <rect class="box" x="0" y="0" width="700" height="100" rx="26"/>
    <text class="label" x="28" y="40">MCP Office delivery example</text>
    <text class="small" x="28" y="72">Plan in ChatGPT, execute in Claude/Copilot lanes, cross-check before publishing.</text>
  </g>

  <path class="arrow" d="M 405 350 C 500 350 530 385 600 405"/>
  <path class="arrow" d="M 870 350 C 985 302 1010 302 1098 302"/>
  <path class="arrow" d="M 872 440 C 980 505 1010 505 1098 505"/>
  <path class="arrow" d="M 780 500 C 780 555 780 575 780 600"/>


  <g transform="translate(100 830)">
    <text class="micro" x="0" y="0">Original repo-hosted blog asset - no stock photography - sample data only</text>
  </g>
  <g transform="translate(1195 830)">
    <rect x="0" y="-28" width="300" height="42" rx="21" fill="rgba(148,163,184,0.14)" stroke="rgba(148,163,184,0.34)"/>
    <text x="24" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Three AI Tools / 1</text>
  </g>
</svg>
