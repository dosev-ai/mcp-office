<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Publishing Workflow Is Live</title>
  <desc id="desc">A governed publishing workflow with privacy and access controls, a central article draft, content review checks, cross-device validation, human approval, and controlled publication.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071923"/>
      <stop offset="0.55" stop-color="#0b2b36"/>
      <stop offset="1" stop-color="#0d3940"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70e1d1"/>
      <stop offset="1" stop-color="#1aa89c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153846"/>
      <stop offset="1" stop-color="#0f2732"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f1f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:700;fill:#f4fbfc}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:600;fill:#eef8f8}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:500;fill:#bdd2d5}
      .muted{fill:#8ea9ad}
      .line{stroke:#4ed6c7;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#78ede0;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1260" cy="110" r="260" fill="#0f5962" opacity="0.28" filter="url(#soft)"/>
  <circle cx="250" cy="810" r="300" fill="#0b5961" opacity="0.18" filter="url(#soft)"/>
  <g opacity="0.18" fill="#72dcd1">
