<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Parallel agent lanes</title>
  <desc id="desc">How scoped worktrees and evidence gates prevent AI-assisted drift</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#052e2b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#84cc16"/>
    </marker>
    <style>
      .title { font: 700 56px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font: 400 25px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .label { font: 700 24px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .micro { font: 400 14px Arial, Helvetica, sans-serif; fill: #94a3b8; }
      .code { font: 700 17px Consolas, Menlo, monospace; fill: #dbeafe; }
      .card { fill: rgba(15, 23, 42, 0.78); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.5; }
      .box { fill: rgba(15, 23, 42, 0.88); stroke: rgba(148, 163, 184, 0.42); stroke-width: 1.5; }
      .boxAccent { fill: rgba(6, 78, 59, 0.58); stroke: #84cc16; stroke-opacity: 0.55; stroke-width: 1.6; }
      .warn { fill: rgba(127, 29, 29, 0.34); stroke: rgba(248, 113, 113, 0.42); stroke-width: 1.4; }
      .arrow { stroke: url(#accent); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .line { stroke: rgba(148, 163, 184, 0.32); stroke-width: 1.2; }
      .pill { fill: rgba(2, 6, 23, 0.42); stroke: rgba(148, 163, 184, 0.26); stroke-width: 1; }
      .chip { font: 700 15px Arial, Helvetica, sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1365" cy="110" r="270" fill="#ffffff" opacity="0.045"/>
  <circle cx="190" cy="795" r="305" fill="#ffffff" opacity="0.04"/>

  <g transform="translate(90 76)">
    <text class="title" x="0" y="0">Parallel agent lanes</text>
    <text class="subtitle" x="0" y="46">How scoped worktrees and evidence gates prevent AI-assisted drift</text>
  </g>

  <g transform="translate(90 170)" filter="url(#shadow)">
    <rect class="card" x="0" y="0" width="1420" height="610" rx="34"/>
  </g>


  <g transform="translate(145 250)">
    <rect class="boxAccent" x="0" y="0" width="300" height="390" rx="28"/>
    <text class="label" x="28" y="45">Lane A</text>
    <text class="small" x="28" y="80">Excel MCP workflow</text>
    <rect class="pill" x="28" y="122" width="238" height="45" rx="16"/><text class="code" x="47" y="151">worktree/excelmcp</text>
    <rect class="pill" x="28" y="187" width="238" height="45" rx="16"/><text class="small" x="47" y="216">single concern</text>
    <rect class="pill" x="28" y="252" width="238" height="45" rx="16"/><text class="small" x="47" y="281">acceptance gate</text>
    <rect class="pill" x="28" y="317" width="238" height="45" rx="16"/><text class="small" x="47" y="346">evidence packet</text>
  </g>

  <g transform="translate(520 250)">
    <rect class="box" x="0" y="0" width="300" height="390" rx="28"/>
    <text class="label" x="28" y="45">Lane B</text>
    <text class="small" x="28" y="80">Docs + examples</text>
    <rect class="pill" x="28" y="122" width="238" height="45" rx="16"/><text class="code" x="47" y="151">worktree/docs</text>
    <rect class="pill" x="28" y="187" width="238" height="45" rx="16"/><text class="small" x="47" y="216">public-safe text</text>
    <rect class="pill" x="28" y="252" width="238" height="45" rx="16"/><text class="small" x="47" y="281">README aligned</text>
    <rect class="pill" x="28" y="317" width="238" height="45" rx="16"/><text class="small" x="47" y="346">no private paths</text>
  </g>

  <g transform="translate(895 250)">
    <rect class="box" x="0" y="0" width="300" height="390" rx="28"/>
    <text class="label" x="28" y="45">Lane C</text>
    <text class="small" x="28" y="80">QA + dogfooding</text>
    <rect class="pill" x="28" y="122" width="238" height="45" rx="16"/><text class="code" x="47" y="151">worktree/uat</text>
    <rect class="pill" x="28" y="187" width="238" height="45" rx="16"/><text class="small" x="47" y="216">read-only review</text>
    <rect class="pill" x="28" y="252" width="238" height="45" rx="16"/><text class="small" x="47" y="281">bug action if fail</text>
    <rect class="pill" x="28" y="317" width="238" height="45" rx="16"/><text class="small" x="47" y="346">close with proof</text>
  </g>

  <g transform="translate(1265 315)">
    <rect class="box" x="0" y="0" width="150" height="260" rx="28"/>
    <text class="label" x="29" y="46">Main</text>
    <text class="small" x="30" y="84">clean</text>
    <text class="small" x="30" y="112">snapshot</text>
    <line x1="30" y1="150" x2="120" y2="150" class="line"/>
    <text class="micro" x="30" y="185">batch merge</text>
    <text class="micro" x="30" y="210">only after</text>
    <text class="micro" x="30" y="235">evidence</text>
  </g>

  <path class="arrow" d="M 445 445 C 475 445 485 445 508 445"/>
  <path class="arrow" d="M 820 445 C 850 445 860 445 883 445"/>
  <path class="arrow" d="M 1195 445 C 1225 445 1235 445 1253 445"/>


  <g transform="translate(100 830)">
    <text class="micro" x="0" y="0">Original repo-hosted blog asset - no stock photography - sample data only</text>
  </g>
  <g transform="translate(1195 830)">
    <rect x="0" y="-28" width="300" height="42" rx="21" fill="rgba(148,163,184,0.14)" stroke="rgba(148,163,184,0.34)"/>
    <text x="24" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">How We Build / 1</text>
  </g>
</svg>
