<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code vs GitHub Copilot</title>
  <desc id="desc">Same editor, different jobs: inline assistance versus scoped delivery lanes</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#a78bfa"/>
    </marker>
    <style>
      .title { font: 700 56px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font: 400 25px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .label { font: 700 24px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .micro { font: 400 14px Arial, Helvetica, sans-serif; fill: #94a3b8; }
      .code { font: 700 17px Consolas, Menlo, monospace; fill: #dbeafe; }
      .card { fill: rgba(15, 23, 42, 0.78); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.5; }
      .box { fill: rgba(15, 23, 42, 0.88); stroke: rgba(148, 163, 184, 0.42); stroke-width: 1.5; }
      .boxAccent { fill: rgba(6, 78, 59, 0.58); stroke: #a78bfa; stroke-opacity: 0.55; stroke-width: 1.6; }
      .warn { fill: rgba(127, 29, 29, 0.34); stroke: rgba(248, 113, 113, 0.42); stroke-width: 1.4; }
      .arrow { stroke: url(#accent); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .line { stroke: rgba(148, 163, 184, 0.32); stroke-width: 1.2; }
      .pill { fill: rgba(2, 6, 23, 0.42); stroke: rgba(148, 163, 184, 0.26); stroke-width: 1; }
      .chip { font: 700 15px Arial, Helvetica, sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1365" cy="110" r="270" fill="#ffffff" opacity="0.045"/>
  <circle cx="190" cy="795" r="305" fill="#ffffff" opacity="0.04"/>

  <g transform="translate(90 76)">
    <text class="title" x="0" y="0">Claude Code vs GitHub Copilot</text>
    <text class="subtitle" x="0" y="46">Same editor, different jobs: inline assistance versus scoped delivery lanes</text>
  </g>

  <g transform="translate(90 170)" filter="url(#shadow)">
    <rect class="card" x="0" y="0" width="1420" height="610" rx="34"/>
  </g>


  <g transform="translate(145 235)">
    <rect class="box" x="0" y="0" width="560" height="430" rx="32"/>
    <text class="label" x="32" y="48">Same editor</text>
    <text class="small" x="32" y="84">Two AI layers working at different altitudes.</text>

    <g transform="translate(32 130)">
      <rect x="0" y="0" width="496" height="245" rx="18" fill="rgba(2,6,23,0.55)" stroke="rgba(148,163,184,0.24)"/>
      <rect x="0" y="0" width="496" height="36" rx="18" fill="rgba(30,41,59,0.9)"/>
      <text class="micro" x="18" y="24">VS Code / pull request context</text>
      <text class="code" x="22" y="78">def validate_contract(workbook):</text>
      <text class="code" x="46" y="112">checks = run_schema_checks(workbook)</text>
      <text class="code" x="46" y="146">return Evidence(status=\"PASS\")</text>
      <rect x="22" y="178" width="452" height="42" rx="12" fill="rgba(96,165,250,0.16)" stroke="rgba(96,165,250,0.35)"/>
      <text class="small" x="42" y="205">Copilot: inline suggestion + diff review</text>
    </g>
  </g>

  <g transform="translate(795 235)">
    <rect class="boxAccent" x="0" y="0" width="560" height="430" rx="32"/>
    <text class="label" x="32" y="48">Different jobs</text>
    <text class="small" x="32" y="84">One helps inside the file. One runs a scoped lane.</text>

    <g transform="translate(32 135)">
      <rect class="pill" x="0" y="0" width="496" height="70" rx="20"/>
      <text class="label" x="24" y="42">Copilot layer</text>
      <text class="micro" x="250" y="42">completion, local context, PR diff</text>

      <rect class="pill" x="0" y="96" width="496" height="70" rx="20"/>
      <text class="label" x="24" y="138">Claude Code lane</text>
      <text class="micro" x="250" y="138">task execution, files, evidence</text>

      <rect class="pill" x="0" y="192" width="496" height="70" rx="20"/>
      <text class="label" x="24" y="234">ChatGPT review</text>
      <text class="micro" x="250" y="234">intent, plan, cross-check</text>
    </g>
  </g>

  <g transform="translate(405 710)">
    <rect class="box" x="0" y="0" width="790" height="62" rx="24"/>
    <text class="small" x="28" y="40">Not a benchmark. A working pattern: inline help, lane execution, and planning review each have separate jobs.</text>
  </g>

  <path class="arrow" d="M 705 450 C 735 450 750 450 782 450"/>


  <g transform="translate(100 830)">
    <text class="micro" x="0" y="0">Original repo-hosted blog asset - no stock photography - sample data only</text>
  </g>
  <g transform="translate(1195 830)">
    <rect x="0" y="-28" width="300" height="42" rx="21" fill="rgba(148,163,184,0.14)" stroke="rgba(148,163,184,0.34)"/>
    <text x="24" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Three AI Tools / 2</text>
  </g>
</svg>
