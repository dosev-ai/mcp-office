<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Power BI to MCP - clean Excel prep before dashboards</title>
  <desc id="desc">A technical pipeline diagram showing raw spend data transformed through excelmcp validation into a Power BI-ready dataset and dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="45%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="power" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="mcp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8"/>
    </marker>
    <style>
      .title { font: 700 58px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font: 400 25px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .label { font: 700 23px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .micro { font: 400 14px Arial, Helvetica, sans-serif; fill: #94a3b8; }
      .code { font: 700 17px Consolas, Menlo, monospace; fill: #dbeafe; }
      .card { fill: rgba(15, 23, 42, 0.78); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.5; }
      .stage { fill: rgba(15, 23, 42, 0.90); stroke: rgba(148, 163, 184, 0.42); stroke-width: 1.5; }
      .stageHot { fill: rgba(120, 53, 15, 0.48); stroke: rgba(250, 204, 21, 0.52); stroke-width: 1.6; }
      .stageMcp { fill: rgba(6, 78, 59, 0.58); stroke: rgba(34, 197, 94, 0.55); stroke-width: 1.6; }
      .arrow { stroke: #38bdf8; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .warn { fill: rgba(239, 68, 68, 0.14); stroke: rgba(248, 113, 113, 0.42); stroke-width: 1.4; }
      .ok { fill: rgba(34, 197, 94, 0.14); stroke: rgba(34, 197, 94, 0.42); stroke-width: 1.4; }
      .tableLine { stroke: rgba(148, 163, 184, 0.28); stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="120" r="270" fill="#facc15" opacity="0.07"/>
  <circle cx="150" cy="790" r="300" fill="#38bdf8" opacity="0.08"/>

  <g transform="translate(90 76)">
    <text class="title" x="0" y="0">Power BI to MCP</text>
    <text class="subtitle" x="0" y="46">Rethinking dashboards by fixing the data-prep layer first</text>
  </g>

  <g transform="translate(90 170)" filter="url(#shadow)">
    <rect class="card" x="0" y="0" width="1420" height="610" rx="34"/>
  </g>

  <!-- Before box -->
  <g transform="translate(130 230)">
    <rect class="warn" x="0" y="0" width="330" height="430" rx="28"/>
    <text class="label" x="28" y="48">Before</text>
    <text class="small" x="28" y="84">Manual prep hides</text>
    <text class="small" x="28" y="112">dashboard risk.</text>

    <g transform="translate(28 160)">
      <rect x="0" y="0" width="274" height="54" rx="12" fill="rgba(15,23,42,0.65)" stroke="rgba(248,113,113,0.28)"/>
      <text class="small" x="18" y="34">copy / paste between sheets</text>
      <rect x="0" y="76" width="274" height="54" rx="12" fill="rgba(15,23,42,0.65)" stroke="rgba(248,113,113,0.28)"/>
      <text class="small" x="18" y="110">manual formulas drift</text>
      <rect x="0" y="152" width="274" height="54" rx="12" fill="rgba(15,23,42,0.65)" stroke="rgba(248,113,113,0.28)"/>
      <text class="small" x="18" y="186">unclear refresh contract</text>
    </g>
  </g>

  <!-- Pipeline stages -->
  <g transform="translate(535 250)">
    <rect class="stage" x="0" y="0" width="215" height="210" rx="26"/>
    <text class="label" x="24" y="42">1. Source data</text>
    <text class="small" x="24" y="77">Spend rows, supplier</text>
    <text class="small" x="24" y="103">fields, categories.</text>
    <g transform="translate(24 132)">
      <rect x="0" y="0" width="167" height="44" rx="10" fill="rgba(2,6,23,0.45)" stroke="rgba(148,163,184,0.28)"/>
      <text class="code" x="16" y="29">raw_spend.csv</text>
    </g>
  </g>

  <g transform="translate(825 250)">
    <rect class="stageMcp" x="0" y="0" width="240" height="210" rx="26"/>
    <text class="label" x="24" y="42">2. MCP prep</text>
    <text class="small" x="24" y="77">Generate a clean,</text>
    <text class="small" x="24" y="103">validated workbook.</text>
    <g transform="translate(24 132)">
      <rect x="0" y="0" width="192" height="44" rx="10" fill="rgba(2,6,23,0.45)" stroke="rgba(34,197,94,0.32)"/>
      <text class="code" x="16" y="29">validate_contract</text>
    </g>
  </g>

  <g transform="translate(1140 250)">
    <rect class="stageHot" x="0" y="0" width="240" height="210" rx="26"/>
    <text class="label" x="24" y="42">3. Power BI</text>
    <text class="small" x="24" y="77">Load a stable Excel</text>
    <text class="small" x="24" y="103">model into reports.</text>
    <g transform="translate(24 132)">
      <rect x="0" y="0" width="192" height="44" rx="10" fill="rgba(2,6,23,0.45)" stroke="rgba(250,204,21,0.32)"/>
      <text class="code" x="16" y="29">dataset refresh</text>
    </g>
  </g>

  <path class="arrow" d="M 762 355 C 788 355 793 355 812 355"/>
  <path class="arrow" d="M 1077 355 C 1103 355 1108 355 1127 355"/>

  <!-- Output dashboard -->
  <g transform="translate(535 540)">
    <rect class="ok" x="0" y="0" width="845" height="170" rx="28"/>
    <text class="label" x="30" y="44">Dashboard-ready output</text>
    <text class="small" x="30" y="80">The dashboard is no longer responsible for cleaning the workbook.</text>
    <text class="small" x="30" y="108">It consumes a governed artifact with repeatable shape and checks.</text>

    <g transform="translate(570 30)">
      <rect x="0" y="0" width="220" height="110" rx="16" fill="rgba(248,250,252,0.96)"/>
      <rect x="24" y="70" width="28" height="24" rx="4" fill="#facc15"/>
      <rect x="64" y="48" width="28" height="46" rx="4" fill="#f59e0b"/>
      <rect x="104" y="30" width="28" height="64" rx="4" fill="#d97706"/>
      <rect x="144" y="58" width="28" height="36" rx="4" fill="#facc15"/>
      <line x1="18" y1="94" x2="190" y2="94" class="tableLine"/>
      <text x="24" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Power BI report</text>
    </g>
  </g>

  <g transform="translate(100 830)">
    <text class="micro" x="0" y="0">Original repo-hosted blog asset - no stock photography - sample data only</text>
  </g>
  <g transform="translate(1190 830)">
    <rect x="0" y="-28" width="305" height="42" rx="21" fill="rgba(250,204,21,0.14)" stroke="rgba(250,204,21,0.35)"/>
    <text x="24" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fef3c7">Excel MCP → Power BI</text>
  </g>
</svg>
