<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Why my blog images live in the repo now</title>
  <desc id="desc">A technical lifecycle diagram showing original visuals moving from SVG source in the public repo to raw GitHub URL, Notion cover, and optional PNG fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="46%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#22c55e"/>
    </marker>
    <style>
      .title { font: 700 56px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font: 400 25px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .label { font: 700 24px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .micro { font: 400 14px Arial, Helvetica, sans-serif; fill: #94a3b8; }
      .code { font: 700 17px Consolas, Menlo, monospace; fill: #dbeafe; }
      .card { fill: rgba(15, 23, 42, 0.78); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.5; }
      .box { fill: rgba(15, 23, 42, 0.88); stroke: rgba(148, 163, 184, 0.42); stroke-width: 1.5; }
      .boxAccent { fill: rgba(6, 78, 59, 0.62); stroke: rgba(34, 197, 94, 0.58); stroke-width: 1.6; }
      .warn { fill: rgba(127, 29, 29, 0.30); stroke: rgba(248, 113, 113, 0.38); stroke-width: 1.4; }
      .arrow { stroke: url(#accent); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .line { stroke: rgba(148, 163, 184, 0.32); stroke-width: 1.2; }
      .pill { fill: rgba(2, 6, 23, 0.42); stroke: rgba(148, 163, 184, 0.26); stroke-width: 1; }
      .chip { font: 700 15px Arial, Helvetica, sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="110" r="270" fill="#38bdf8" opacity="0.06"/>
  <circle cx="170" cy="790" r="305" fill="#22c55e" opacity="0.07"/>

  <g transform="translate(90 76)">
    <text class="title" x="0" y="0">Why my blog images live in the repo now</text>
    <text class="subtitle" x="0" y="46">A cover image should be part of the artifact, not decoration</text>
  </g>

  <g transform="translate(90 170)" filter="url(#shadow)">
    <rect class="card" x="0" y="0" width="1420" height="610" rx="34"/>
  </g>

  <g transform="translate(130 250)">
    <rect class="warn" x="0" y="0" width="270" height="345" rx="28"/>
    <text class="label" x="28" y="48">Old pattern</text>
    <text class="small" x="28" y="86">Generic cover image</text>
    <text class="small" x="28" y="114">from a stock source.</text>
    <line class="line" x1="28" y1="154" x2="235" y2="154"/>
    <text class="micro" x="28" y="196">Looks polished.</text>
    <text class="micro" x="28" y="226">Does not explain the post.</text>
    <text class="micro" x="28" y="256">Hard to version.</text>
    <text class="micro" x="28" y="286">Disconnected from proof.</text>
  </g>

  <g transform="translate(495 225)">
    <rect class="boxAccent" x="0" y="0" width="250" height="235" rx="28"/>
    <text class="label" x="26" y="46">1. Original SVG</text>
    <text class="small" x="26" y="82">A diagram that explains</text>
    <text class="small" x="26" y="110">the article claim.</text>
    <rect class="pill" x="26" y="150" width="198" height="48" rx="16"/>
    <text class="code" x="45" y="181">cover.svg</text>
  </g>

  <g transform="translate(815 225)">
    <rect class="box" x="0" y="0" width="250" height="235" rx="28"/>
    <text class="label" x="26" y="46">2. Public repo</text>
    <text class="small" x="26" y="82">Stored beside the</text>
    <text class="small" x="26" y="110">project evidence.</text>
    <rect class="pill" x="26" y="150" width="198" height="48" rx="16"/>
    <text class="code" x="45" y="181">docs/blog/assets</text>
  </g>

  <g transform="translate(1135 225)">
    <rect class="box" x="0" y="0" width="250" height="235" rx="28"/>
    <text class="label" x="26" y="46">3. Raw URL</text>
    <text class="small" x="26" y="82">Stable link for</text>
    <text class="small" x="26" y="110">Notion-first posts.</text>
    <rect class="pill" x="26" y="150" width="198" height="48" rx="16"/>
    <text class="code" x="45" y="181">raw.githubusercontent</text>
  </g>

  <path class="arrow" d="M 412 395 C 455 395 462 350 483 350"/>
  <path class="arrow" d="M 757 350 C 780 350 788 350 803 350"/>
  <path class="arrow" d="M 1077 350 C 1100 350 1108 350 1123 350"/>

  <g transform="translate(495 545)">
    <rect class="box" x="0" y="0" width="890" height="155" rx="28"/>
    <text class="label" x="30" y="46">Publishing rule</text>
    <text class="small" x="30" y="82">If the image cannot explain the post, it should not be the cover.</text>
    <text class="small" x="30" y="112">First run: use SVG raw URL in Notion. Fallback: export PNG only if SVG rendering fails.</text>
  </g>

  <path class="arrow" d="M 1260 470 C 1260 500 1245 518 1210 535"/>

  <g transform="translate(100 830)">
    <text class="micro" x="0" y="0">Original repo-hosted blog asset - no stock photography - sample data only</text>
  </g>
  <g transform="translate(1195 830)">
    <rect x="0" y="-28" width="300" height="42" rx="21" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.35)"/>
    <text x="24" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#dcfce7">Repo-hosted visuals</text>
  </g>
</svg>
