<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">First Excel MCP Workflow - structured input to validated artifact</title>
  <desc id="desc">A clean technical flow diagram showing structured input moving through governed excelmcp operations, validation, and export to a final artifact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="48%" stop-color="#102033"/>
      <stop offset="100%" stop-color="#0b3b3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 700 58px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font: 400 25px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .label { font: 700 23px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .code { font: 700 18px Consolas, Menlo, monospace; fill: #d1fae5; }
      .micro { font: 400 14px Arial, Helvetica, sans-serif; fill: #94a3b8; }
      .card { fill: rgba(15, 23, 42, 0.78); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.5; }
      .step { fill: rgba(15, 23, 42, 0.88); stroke: rgba(148, 163, 184, 0.42); stroke-width: 1.5; }
      .stepAccent { fill: rgba(6, 78, 59, 0.70); stroke: rgba(52, 211, 153, 0.55); stroke-width: 1.5; }
      .arrow { stroke: url(#accent); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .tableHead { fill: rgba(56, 189, 248, 0.18); }
      .tableCell { fill: rgba(248, 250, 252, 0.98); stroke: rgba(148, 163, 184, 0.35); stroke-width: 1; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1340" cy="90" r="260" fill="#38bdf8" opacity="0.08"/>
  <circle cx="200" cy="790" r="300" fill="#34d399" opacity="0.07"/>

  <g transform="translate(90 76)">
    <text class="title" x="0" y="0">Your first Excel MCP workflow</text>
    <text class="subtitle" x="0" y="46">From structured input to a validated Office artifact</text>
  </g>

  <g transform="translate(90 170)" filter="url(#shadow)">
    <rect class="card" x="0" y="0" width="1420" height="610" rx="34"/>
  </g>

  <g transform="translate(130 245)">
    <rect class="step" x="0" y="0" width="245" height="250" rx="26"/>
    <text class="label" x="24" y="42">1. Structured input</text>
    <text class="small" x="24" y="76">Clean rows, clear schema,</text>
    <text class="small" x="24" y="101">no manual copy-paste.</text>
    <rect x="24" y="130" width="197" height="86" rx="12" fill="rgba(2, 6, 23, 0.45)" stroke="rgba(148,163,184,0.32)"/>
    <text class="code" x="42" y="163">budget_items.json</text>
    <text class="micro" x="42" y="190">rows + columns + types</text>
  </g>

  <g transform="translate(455 245)">
    <rect class="step" x="0" y="0" width="245" height="250" rx="26"/>
    <text class="label" x="24" y="42">2. Write workbook</text>
    <text class="small" x="24" y="76">Governed range write</text>
    <text class="small" x="24" y="101">into a known template.</text>
    <rect x="24" y="130" width="197" height="86" rx="12" fill="rgba(2, 6, 23, 0.45)" stroke="rgba(148,163,184,0.32)"/>
    <text class="code" x="42" y="163">range_io.write</text>
    <text class="micro" x="42" y="190">deterministic tool call</text>
  </g>

  <g transform="translate(780 245)">
    <rect class="step" x="0" y="0" width="245" height="250" rx="26"/>
    <text class="label" x="24" y="42">3. Apply style</text>
    <text class="small" x="24" y="76">Format headers, totals,</text>
    <text class="small" x="24" y="101">widths, and number types.</text>
    <rect x="24" y="130" width="197" height="86" rx="12" fill="rgba(2, 6, 23, 0.45)" stroke="rgba(148,163,184,0.32)"/>
    <text class="code" x="42" y="163">apply_style</text>
    <text class="micro" x="42" y="190">repeatable layout</text>
  </g>

  <g transform="translate(1105 245)">
    <rect class="stepAccent" x="0" y="0" width="245" height="250" rx="26"/>
    <text class="label" x="24" y="42">4. Validate</text>
    <text class="small" x="24" y="76">Check sheet contract</text>
    <text class="small" x="24" y="101">before publishing output.</text>
    <rect x="24" y="130" width="197" height="86" rx="12" fill="rgba(2, 6, 23, 0.45)" stroke="rgba(52,211,153,0.32)"/>
    <text class="code" x="42" y="163">validate_contract</text>
    <text class="micro" x="42" y="190">PASS / FAIL gate</text>
  </g>

  <path class="arrow" d="M 387 370 C 415 370 424 370 443 370"/>
  <path class="arrow" d="M 712 370 C 740 370 749 370 768 370"/>
  <path class="arrow" d="M 1037 370 C 1065 370 1074 370 1093 370"/>

  <g transform="translate(130 565)">
    <rect class="step" x="0" y="0" width="575" height="145" rx="26"/>
    <text class="label" x="26" y="42">5. Export artifact</text>
    <text class="small" x="26" y="76">After validation, the workflow exports a file that can be shared,</text>
    <text class="small" x="26" y="105">reviewed, or archived without manual rework.</text>
    <text class="code" x="360" y="104">export_as_pdf</text>
  </g>

  <g transform="translate(765 548)" filter="url(#shadow)">
    <rect x="0" y="0" width="585" height="190" rx="24" fill="#f8fafc"/>
    <rect x="30" y="28" width="525" height="34" rx="8" class="tableHead"/>
    <text x="50" y="51" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Validated renovation budget - sample output</text>
    <g transform="translate(30 78)">
      <rect class="tableCell" x="0" y="0" width="170" height="36"/>
      <rect class="tableCell" x="170" y="0" width="170" height="36"/>
      <rect class="tableCell" x="340" y="0" width="185" height="36"/>
      <text x="18" y="24" font-family="Arial" font-size="15" fill="#0f172a">Category</text>
      <text x="188" y="24" font-family="Arial" font-size="15" fill="#0f172a">Amount</text>
      <text x="358" y="24" font-family="Arial" font-size="15" fill="#0f172a">Check</text>
      <rect class="tableCell" x="0" y="36" width="170" height="36"/>
      <rect class="tableCell" x="170" y="36" width="170" height="36"/>
      <rect class="tableCell" x="340" y="36" width="185" height="36"/>
      <text x="18" y="60" font-family="Arial" font-size="15" fill="#334155">Materials</text>
      <text x="188" y="60" font-family="Arial" font-size="15" fill="#334155">EUR 4,200</text>
      <text x="358" y="60" font-family="Arial" font-size="15" fill="#047857">PASS</text>
      <rect class="tableCell" x="0" y="72" width="170" height="36"/>
      <rect class="tableCell" x="170" y="72" width="170" height="36"/>
      <rect class="tableCell" x="340" y="72" width="185" height="36"/>
      <text x="18" y="96" font-family="Arial" font-size="15" fill="#334155">Contingency</text>
      <text x="188" y="96" font-family="Arial" font-size="15" fill="#334155">EUR 750</text>
      <text x="358" y="96" font-family="Arial" font-size="15" fill="#047857">PASS</text>
    </g>
  </g>

  <path class="arrow" d="M 717 637 C 744 637 738 637 753 637"/>

  <g transform="translate(100 830)">
    <text class="micro" x="0" y="0">Original repo-hosted blog asset - no stock photography - sample data only</text>
  </g>
  <g transform="translate(1235 830)">
    <rect x="0" y="-28" width="260" height="42" rx="21" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.35)"/>
    <text x="24" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#d1fae5">MCP Office / excelmcp</text>
  </g>
</svg>