# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
#
# IMPORTANT: This server runs locally on the USER's machine (Windows + Microsoft Excel required).
# It cannot run on Smithery's hosted Linux infrastructure.
# Set target: local so Smithery routes to the local execution path.

target: local

startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      excelEnableWrite:
        type: string
        default: "false"
        description: "Enable write operations. Set to 'true' to allow cell writes, sheet creation, formatting, etc. Requires Windows + Microsoft Excel."
      excelAllowlistRoots:
        type: string
        default: ""
        description: "Comma-separated list of allowed file path roots (e.g. 'C:\\Users\\me\\Documents,D:\\Projects'). Access outside these roots is blocked."
      excelMaxItems:
        type: string
        default: "50"
        description: Maximum number of rows/items returned per call
      excelMaxBodyChars:
        type: string
        default: "4000"
        description: Maximum characters returned for cell content
  commandFunction:
    |-
    (config) => ({
      command: 'python',
      args: ['-m', 'excelmcp.server'],
      env: {
        EXCEL_ENABLE_WRITE: config.excelEnableWrite || 'false',
        EXCEL_ALLOWLIST_ROOTS: config.excelAllowlistRoots || '',
        EXCEL_MAX_ITEMS: config.excelMaxItems || '50',
        EXCEL_MAX_BODY_CHARS: config.excelMaxBodyChars || '4000'
      }
    })
