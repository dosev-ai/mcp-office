# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      pptEnableWrite:
        type: string
        default: "false"
        description: Enable write operations. Set to "true" to allow slide editing, shape creation, etc.
      pptAllowlistRoots:
        type: string
        default: ""
        description: Comma-separated list of allowed file path roots
      pptMaxItems:
        type: string
        default: "50"
        description: Maximum number of slides/shapes returned per call
  commandFunction:
    |-
    (config) => ({
      command: 'python',
      args: ['-m', 'pptmcp.server'],
      env: {
        PPT_ENABLE_WRITE: config.pptEnableWrite || 'false',
        PPT_ALLOWLIST_ROOTS: config.pptAllowlistRoots || '',
        PPT_MAX_ITEMS: config.pptMaxItems || '50'
      }
    })
