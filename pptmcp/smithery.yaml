# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
#
# IMPORTANT: This server runs locally on the USER's machine (Windows required).
# File-based tools (python-pptx) run without PowerPoint installed.
# COM-backed tools (PDF/PNG export, slide show) additionally require Microsoft PowerPoint.
# This server cannot run on Smithery's hosted Linux infrastructure.
# Set target: local so Smithery routes to the local execution path.

target: local

startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      pptEnableWrite:
        type: string
        default: "false"
        description: "Enable write operations. Set to 'true' to allow slide editing and shape creation. File-based operations run on Windows without PowerPoint installed. COM export tools (PDF, PNG, slide show) additionally require Microsoft PowerPoint and PPT_ENABLE_COM=true."
      pptAllowlistRoots:
        type: string
        default: ""
        description: "Comma-separated list of allowed file path roots. Access outside these roots is blocked."
      pptMaxItems:
        type: string
        default: "50"
        description: Maximum number of slides/shapes returned per call
  commandFunction:
    |-
    (config) => ({
      command: 'python',
      args: ['-m', 'pptmcp.server'],
      env: {
        PPT_ENABLE_WRITE: config.pptEnableWrite || 'false',
        PPT_ALLOWLIST_ROOTS: config.pptAllowlistRoots || '',
        PPT_MAX_ITEMS: config.pptMaxItems || '50'
      }
    })
