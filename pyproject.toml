[project]
name = "mcp-office"
version = "0.7.0"
requires-python = ">=3.11"
description = "Local-first MCP servers for Microsoft Office — Excel, PowerPoint, and Word automation via the Model Context Protocol. Runs on Windows."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Delyan Dosev", email = "ddossev@gmail.com" }]
keywords = [
    "mcp", "model-context-protocol", "microsoft-office", "office-automation",
    "fastmcp", "python", "automation", "ai", "claude",
    "excel", "powerpoint", "word", "xlsx", "pptx", "docx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "fastmcp>=3.2.0,<4",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "Pillow>=10.0",
    "python-docx>=0.8.11",
]

[project.optional-dependencies]
com = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "ruff>=0.4", "pytest-socket>=0.7"]

[project.scripts]
excelmcp = "excelmcp.server:main"
pptmcp = "pptmcp.server:main"
wordmcp = "wordmcp.server:main"

[project.urls]
Homepage = "https://github.com/dosev-ai/mcp-office"
Repository = "https://github.com/dosev-ai/mcp-office"
"Bug Tracker" = "https://github.com/dosev-ai/mcp-office/issues"
Changelog = "https://github.com/dosev-ai/mcp-office/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "excelmcp",
    "pptmcp",
    "wordmcp",
    "wordmcp._com",
    "wordmcp._docx",
    "mcpshared",
]

[tool.setuptools.package-dir]
excelmcp  = "excelmcp/src/excelmcp"
pptmcp    = "pptmcp/src/pptmcp"
wordmcp   = "wordmcp/src/wordmcp"
mcpshared = "shared/src/mcpshared"
