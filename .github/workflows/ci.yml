name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check excelmcp/src shared/ --ignore E501

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install excelmcp
        run: pip install -e "./excelmcp[dev]"
      - name: Run unit tests
        run: pytest excelmcp/tests/ -q --tb=short -m "not integration"

  startup-smoke:
    name: Startup smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install excelmcp
        run: pip install -e "./excelmcp"
      - name: Startup smoke test
        env:
          EXCEL_ALLOWLIST_ROOTS: /tmp
        run: |
          python - << 'PYEOF'
          import excelmcp
          from excelmcp import workbook_openpyxl as wb
          result = wb.capabilities()
          assert "tools" in result, "capabilities() missing 'tools' key"
          assert "capabilities_v2" in result, "capabilities() missing 'capabilities_v2' key"
          assert len(result["tools"]) >= 60, f"Expected >= 60 tools, got {len(result['tools'])}"
          print(f"Startup smoke PASS — {len(result['tools'])} tools, capabilities_v2 present")
          PYEOF
