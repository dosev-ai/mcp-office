name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check excelmcp/src shared/ --ignore E501

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install excelmcp
        run: pip install -e "./excelmcp[dev]"
      - name: Run unit tests
        run: pytest excelmcp/tests/ -q --tb=short -m "not integration"

  startup-smoke:
    name: Startup smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install excelmcp
        run: pip install -e "./excelmcp"
      - name: Write smoke script
        run: |
          cat > /tmp/smoke.py << 'PYEOF'
          import subprocess, json, sys, os
          p = subprocess.Popen(
              [sys.executable, "-m", "excelmcp.server"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              env={**os.environ, "EXCEL_ALLOWLIST_ROOTS": "/tmp"},
          )
          msg = json.dumps({"jsonrpc": "2.0", "method": "initialize", "id": 1, "params": {}}).encode()
          try:
              out, _ = p.communicate(msg, timeout=10)
              assert b"result" in out, "Unexpected output: " + repr(out[:200])
              print("Startup smoke PASS")
          except Exception as e:
              print("Startup smoke FAIL: " + str(e))
              sys.exit(1)
          PYEOF
      - name: Startup smoke test
        run: python /tmp/smoke.py
