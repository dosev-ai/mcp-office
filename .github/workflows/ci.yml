name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.4
      - name: Ruff check
        run: ruff check excelmcp/src pptmcp/src wordmcp/src mailmcp/src shared/ --ignore E501

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install excelmcp
        run: pip install -e "./excelmcp[dev]"
      - name: Run unit tests
        run: pytest excelmcp/tests/ -q --tb=short -m "not integration"

  test-pptmcp:
    name: Tests (pptmcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared + pptmcp
        run: |
          pip install -e "./shared"
          pip install -e "./pptmcp[dev]"
      - name: Run unit tests
        run: pytest pptmcp/tests/ -q --tb=short -m "not integration and not com"

  test-wordmcp:
    name: Tests (wordmcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wordmcp
        run: pip install -e "./wordmcp[dev]"
      - name: Run unit tests
        run: pytest wordmcp/tests/ -q --tb=short -m "not integration and not com"

  test-mailmcp:
    name: Tests (mailmcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MailMCP test dependencies
        run: pip install "fastmcp>=3.2.0,<4" "pytest>=8.0"
      - name: Run public MailMCP unit tests
        env:
          PYTHONPATH: mailmcp/src
        run: pytest mailmcp/tests/ -q --tb=short

  startup-smoke:
    name: Startup smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install excelmcp
        run: pip install -e "./excelmcp"
      - name: Startup smoke test
        env:
          EXCEL_ALLOWLIST_ROOTS: /tmp
        run: |
          cd /tmp && python - << 'PYEOF'
          from excelmcp import workbook_openpyxl as wb
          result = wb.capabilities()
          assert "tools" in result, "capabilities() missing 'tools' key"
          assert "capabilities_v2" in result, "capabilities() missing 'capabilities_v2' key"
          assert len(result["tools"]) >= 60, "Expected >= 60 tools, got " + str(len(result["tools"]))
          print("Excel startup smoke PASS - " + str(len(result["tools"])) + " tools, capabilities_v2 present")
          PYEOF
          PYTHONPATH="$GITHUB_WORKSPACE/mailmcp/src" python - << 'PYEOF'
          from mailmcp.server import mcp
          assert mcp is not None
          print("MailMCP import/startup wiring smoke PASS")
          PYEOF
