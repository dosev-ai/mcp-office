name: Distribution integrity

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "README.md"
      - "LICENSE*"
      - "setup.py"
      - "setup.cfg"
      - "MANIFEST.in"
      - "excelmcp/**"
      - "pptmcp/**"
      - "wordmcp/**"
      - "shared/**"
      - "mailmcp/**"
      - ".github/scripts/verify_distribution.py"
      - ".github/workflows/distribution-integrity.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  distribution-integrity:
    name: Distribution integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging verification tools
        run: python -m pip install "build==1.3.0" "twine==6.2.0"
      - name: Build root mcp-office distribution
        run: python -m build --sdist --wheel .
      - name: Verify wheel, sdist, metadata, packages, and entry points
        run: python .github/scripts/verify_distribution.py --dist dist --project pyproject.toml
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify fresh artifact installation
        run: |
          python -m venv .dist-venv
          .dist-venv/bin/python -m pip install --upgrade pip
          .dist-venv/bin/python -m pip install dist/*.whl
          .dist-venv/bin/python -m pip check
          .dist-venv/bin/python - <<'PY'
          from importlib.metadata import distribution

          dist = distribution("mcp-office")
          assert dist.metadata["Name"] == "mcp-office"
          print(f"Fresh artifact install PASS - mcp-office {dist.version}")
          PY
