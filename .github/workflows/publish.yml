name: Publish to PyPI

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify mcp-office distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging verification tools
        run: python -m pip install "build==1.3.0" "twine==6.2.0"
      - name: Build root mcp-office wheel and sdist
        run: python -m build --sdist --wheel .
      - name: Verify release tag, metadata, packages, and entry points
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python .github/scripts/verify_distribution.py
          --dist dist
          --project pyproject.toml
          --release-tag "${RELEASE_TAG}"
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify release-built wheel installation and entry points
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python -m pip check
          .release-venv/bin/python - <<'PY'
          from importlib.metadata import distribution

          dist = distribution("mcp-office")
          assert dist.metadata["Name"] == "mcp-office"
          console = {
              entry_point.name: entry_point
              for entry_point in dist.entry_points
              if entry_point.group == "console_scripts"
          }
          required = {"excelmcp", "pptmcp", "wordmcp"}
          missing = sorted(required - set(console))
          assert not missing, f"Missing required console entry points: {missing}"
          for name, entry_point in sorted(console.items()):
              target = entry_point.load()
              assert callable(target), f"Console entry point {name!r} is not callable"
              print(f"Loaded console entry point: {name} -> {entry_point.value}")
          print(f"Release artifact install PASS - mcp-office {dist.version}")
          PY
      - name: Record tag-to-artifact provenance
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release-evidence
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "source_sha=${GITHUB_SHA}"
            sha256sum dist/*
          } | tee release-evidence/provenance.txt
          {
            echo "### Release build evidence"
            echo "- Release tag: ${RELEASE_TAG}"
            echo "- Source SHA: ${GITHUB_SHA}"
            echo "- Distribution: mcp-office"
            echo ""
            echo '```text'
            cat release-evidence/provenance.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-office-dist-${{ github.event.release.tag_name }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcp-office-provenance-${{ github.event.release.tag_name }}-${{ github.sha }}
          path: release-evidence/provenance.txt
          if-no-files-found: error
          retention-days: 90

  publish-pypi:
    name: Publish mcp-office to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcp-office-dist-${{ github.event.release.tag_name }}-${{ github.sha }}
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
